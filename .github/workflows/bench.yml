name: Benchmark

# Heavy runs only by hand. They rewrite results/ in the runner, then upload them.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: ./init.sh
      - run: .venv/bin/distillroute run
      - run: .venv/bin/distillroute timings
      - run: .venv/bin/distillroute curve
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
