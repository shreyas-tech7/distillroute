[project]
name = "distillroute"
version = "0.1.0rc1"
description = "Train a small numpy classifier on LLM labels to route support tickets, and send only the hard cases to the LLM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Shreyas" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
embed = ["fastembed>=0.4"]

[project.scripts]
distillroute = "distillroute.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distillroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
